                                                                                const { useEffect, useMemo, useState } = React;

    function normaliseFormValues(values) {
      const normalised = { ...defaultForm, ...(values || {}) };
      if (!normalised.projectDescription && normalised.oneLineJustification) {
        normalised.projectDescription = normalised.oneLineJustification;
      }
      if (!normalised.oneLineJustification && normalised.projectDescription) {
        normalised.oneLineJustification = normalised.projectDescription;
      }
      if (!normalised.projectManager) {
        normalised.projectManager = currentUserProfile.name;
      }
      return normalised;
    }

    function getStoredSettings() {
      try {
        const stored = window.localStorage.getItem(settingsStorageKey);
        if (!stored) {
          return {
            defaultRoadmapView: "monthly",
            showDraftProjects: true
          };
        }

        return {
          defaultRoadmapView: "monthly",
          showDraftProjects: true,
          ...JSON.parse(stored)
        };
      } catch {
        return {
          defaultRoadmapView: "monthly",
          showDraftProjects: true
        };
      }
    }

    function getFormCompletion(values) {
      const normalised = normaliseFormValues(values);
      const completedFields = requiredBriefFields.filter((field) => normalised[field]).length;
      return Math.round((completedFields / requiredBriefFields.length) * 100);
    }

    function getDurationInDays(startDate, targetEndDate) {
      if (!startDate || !targetEndDate) return 0;
      const start = new Date(startDate);
      const end = new Date(targetEndDate);
      const diff = end.getTime() - start.getTime();
      if (Number.isNaN(diff) || diff < 0) return 0;
      return Math.max(1, Math.ceil(diff / (1000 * 60 * 60 * 24)));
    }

    function deriveDeliveryTimeline(startDate, targetEndDate) {
      const durationInDays = getDurationInDays(startDate, targetEndDate);
      if (!durationInDays) return "";
      if (durationInDays <= 90) return "upto3";
      if (durationInDays <= 183) return "3to6";
      if (durationInDays <= 366) return "6to12";
      return "over12";
    }

    function buildAssessmentInput(values) {
      const normalised = normaliseFormValues(values);
      return {
        ...normalised,
        oneLineJustification: normalised.projectDescription || normalised.oneLineJustification,
        deliveryTimeline: deriveDeliveryTimeline(normalised.startDate, normalised.targetEndDate),
        impactedTeams: normalised.impactedTeams || "2to3"
      };
    }

    function getDepartmentPrefix(department) {
      const prefixMap = {
        IT: "IT",
        Finance: "FIN",
        Facilities: "FAC",
        HR: "HR",
        PMO: "PMO",
        MKS: "MKS",
        Tax: "TAX",
        Audit: "AUD",
        People: "PPL",
        Marketing: "MKT",
        "L&D": "LD"
      };

      if (prefixMap[department]) return prefixMap[department];
      const cleaned = (department || "GEN").replace(/[^A-Za-z]/g, "").toUpperCase();
      return cleaned.slice(0, 3) || "GEN";
    }

    function getNextProjectNumber(projectList, department) {
      const prefix = getDepartmentPrefix(department);
      const matchingNumbers = projectList
        .filter((project) => project.department === department || `${project.projectNumber || ""}`.startsWith(prefix))
        .map((project) => {
          const match = `${project.projectNumber || ""}`.match(/(\d+)$/);
          return match ? Number(match[1]) : 0;
        });
      const nextNumber = (matchingNumbers.length ? Math.max(...matchingNumbers) : 0) + 1;
      return `${prefix}${String(nextNumber).padStart(6, "0")}`;
    }

    function notifyPmoMailbox(project) {
      // Placeholder for future PMO mailbox integration.
      // This is where a real email, workflow, or API notification would be sent.
      return {
        projectName: project.name,
        projectNumber: project.projectNumber,
        submittedBy: project.createdBy || currentUserProfile.name,
        submittedAt: new Date().toLocaleString("en-GB", { dateStyle: "short", timeStyle: "short" })

    }

    function getInitials(name) {
      return (name || "")
        .split(" ")
        .filter(Boolean)
        .slice(0, 2)
        .map((part) => part[0])
        .join("")
        .toUpperCase() || "MK";
    }

    function normaliseProjectName(name) {
      return (name || "").trim().toLowerCase();

    function getProjectMetadataOverrides(name) {
      return projectMetadataOverrides[normaliseProjectName(name)] || {};

    function dedupeProjectsByName(projectList) {
      const dedupedProjects = [];

      projectList.forEach((project) => {
        const existingIndex = dedupedProjects.findIndex((candidate) => normaliseProjectName(candidate.name) === normaliseProjectName(project.name));
        if (existingIndex === -1) {
          dedupedProjects.push(project);
          return;
        }

        const existingProject = dedupedProjects[existingIndex];
        const existingPriority = existingProject.status === "Draft" ? 0 : 1;
        const incomingPriority = project.status === "Draft" ? 0 : 1;
        const existingDataWeight = (existingProject.submittedDocuments?.length || 0) + (existingProject.draftFormValues ? 1 : 0);
        const incomingDataWeight = (project.submittedDocuments?.length || 0) + (project.draftFormValues ? 1 : 0);

        if (incomingPriority > existingPriority || (incomingPriority === existingPriority && incomingDataWeight >= existingDataWeight)) {
          dedupedProjects[existingIndex] = project;
        }
      });

      return dedupedProjects;
    }

    function repairKnownSubmittedProjects(projectList) {
      return dedupeProjectsByName(projectList.map((project) => {
        if (normaliseProjectName(project.name) !== "nuthatch") {
          return project;
        }

        const fallbackDocumentList = [
          "Project Charter",
          "Business Case",
          "Risk Assessment Template",
          "Data Privacy Assessment Form",
          "Information Security Review Form"
        ];
        const repairedProject = {
          ...project,
          status: "Submitted",
          roadmapPhase: "submitted",
          completionPercentage: 0,
          currentRisk: "Submitted - pending review",
          whatHappenedLastMonth: "The project brief and supporting documents were submitted into the intake workflow.",
          currentPosition: `Submitted and waiting for PMO and ${project.department || "Finance"} leadership review before the next decision board.`,
          next30DaysPipeline: "Complete the PMO and department review, confirm whether any clarifications are needed, and take the proposal to the next decision board.",
          steeringDecisionNeeded: "A decision board outcome is needed to confirm whether the project is approved to move forward or sent back for more detail.",
          draftFormValues: null,
          submittedDocuments: project.submittedDocuments?.length
            ? project.submittedDocuments
            : (project.draftFormValues && isComplete(project.draftFormValues)
              ? buildSubmittedDocumentsFromValues(project.draftFormValues, {}, assess(buildAssessmentInput(project.draftFormValues)), project.name).map((document) => ({
                  ...document,
                  uploadedAt: "Submitted earlier"
                }))
              : fallbackDocumentList.map((documentName) => ({
                  documentName,
                  fileName: "Uploaded Word document",
                  uploadedAt: "Submitted earlier",
                  readOnlyContent: createDocumentReadOnlyContent(documentName, {
                    projectName: project.name,
                    projectManager: project.projectManager,
                    primarySponsor: project.primarySponsor,
                    department: project.department || "Finance",
                    oneLineJustification: project.businessObjective || "Submitted project awaiting PMO and department review.",
                    deliveryTimeline: "3to6",
                    budgetBand: "25001to50000",
                    impactedTeams: "2to3",
                    clientSensitiveData: "yes",
                    audienceType: "client",
                    strategicImportance: "high"
                  }, project.name)
                })))
        };

        return repairedProject;
      }));
    }

    function getTshirtSizeHint(size) {
      const hints = {
        XS: "Small change",
        S: "Smaller project",
        M: "Medium project",
        L: "Larger piece of work",
        XL: "Large and complex",
        XXL: "Programme-scale"
      };

      return hints[size] || "Project size";
    }

    function buildScoreBreakdown(values) {
      const assessmentValues = buildAssessmentInput(values);
      const items = [
        { key: "strategicPriority", label: "Strategic priority", group: "strategicImportance", value: assessmentValues.strategicImportance },
        { key: "budget", label: "Budget", group: "budget", value: assessmentValues.budgetBand },
        { key: "timeline", label: "Timeline", group: "deliveryTimeline", value: assessmentValues.deliveryTimeline },
        { key: "teams", label: "Impacted teams", group: "impactedTeams", value: assessmentValues.impactedTeams },
        { key: "data", label: "Sensitive data", group: "clientSensitiveData", value: assessmentValues.clientSensitiveData },
        { key: "audience", label: "Audience", group: "audienceType", value: assessmentValues.audienceType }
      ];

      return items.map((item) => {
        const scoreMap = scoringRules.scores[item.group] || {};
        const max = Math.max(1, ...Object.values(scoreMap));
        const score = scoreMap[item.value] || 0;

        return {
          ...item,
          score,
          max,
          percent: Math.round((score / max) * 100)
        };
      });
    }

    function createDocumentReadOnlyContent(documentName, values, projectNameOverride = "") {
      const projectName = projectNameOverride || values.projectName || "Submitted project";
      const sponsor = values.primarySponsor || "To be confirmed";
      const manager = values.projectManager || "To be confirmed";
      const department = values.department || "To be confirmed";
      const objective = values.projectDescription || values.oneLineJustification || "No business objective was captured in the prototype record.";
      const assessmentValues = buildAssessmentInput(values);
      const timeline = values.startDate && values.targetEndDate
        ? `${values.startDate} to ${values.targetEndDate}`
        : (intakeOptions.deliveryTimeline || []).find((item) => item.value === assessmentValues.deliveryTimeline)?.label || "To be confirmed";
      const budget = (intakeOptions.budgetBands || []).find((item) => item.value === values.budgetBand)?.label || "To be confirmed";
      const dataLabel = values.clientSensitiveData === "yes" ? "Yes" : values.clientSensitiveData === "no" ? "No" : "To be confirmed";
      const teamsLabel = (intakeOptions.impactedTeams || []).find((item) => item.value === assessmentValues.impactedTeams)?.label || "To be confirmed";
      const audienceLabel = (intakeOptions.audienceType || []).find((item) => item.value === values.audienceType)?.label || "To be confirmed";
      const priorityLabel = (intakeOptions.strategicImportance || []).find((item) => item.value === values.strategicImportance)?.label || "To be confirmed";

      const commonIntro = `Project: ${projectName}\nSponsor: ${sponsor}\nProject manager: ${manager}\nDepartment: ${department}`;

      if (documentName === "Project Charter") {
        return `${commonIntro}\n\nSummary\n${objective}\n\nScope and delivery window\nEstimated timeline: ${timeline}\nBudget band: ${budget}\nImpacted teams: ${teamsLabel}`;
      }

      if (documentName === "Business Case") {
        return `${commonIntro}\n\nBusiness need\n${objective}\n\nWhy this matters\nStrategic priority: ${priorityLabel}\nAudience: ${audienceLabel}\nExpected delivery window: ${timeline}`;
      }

      if (documentName === "Risk Assessment Template") {
        return `${commonIntro}\n\nInitial risks captured\nSensitive data: ${dataLabel}\nImpacted teams: ${teamsLabel}\nKey watchpoint: governance, delivery, and adoption risks need to be reviewed before approval.`;
      }

      if (documentName === "Data Privacy Assessment Form") {
        return `${commonIntro}\n\nPrivacy snapshot\nSensitive data involved: ${dataLabel}\nAudience: ${audienceLabel}\nNext step: confirm data handling, access, and retention controls during review.`;
      }

      if (documentName === "Information Security Review Form") {
        return `${commonIntro}\n\nSecurity snapshot\nSensitive data involved: ${dataLabel}\nBudget band: ${budget}\nNext step: PMO and the relevant department should confirm the required control review before decision board approval.`;
      }

      return `${commonIntro}\n\nSubmitted summary\n${objective}`;
    }

    function buildSubmittedDocumentsFromValues(values, uploadedDocuments, assessment, projectNameOverride = "") {
      const uploadedAt = new Date().toLocaleDateString("en-GB");
      const requiredDocuments = assessment?.requiredDocuments || [];

      return requiredDocuments.map((documentName) => ({
        documentName,
        fileName: uploadedDocuments?.[documentName]?.name || "Uploaded Word document",
        uploadedAt,
        readOnlyContent: createDocumentReadOnlyContent(documentName, values, projectNameOverride)
      }));
    }

    function buildTriangleFromIndicators(project) {
      if (project.status === "Draft") return null;

      const base = Math.max(2, Math.min(5, Math.round((project.overallScore || 50) / 20)));
      const time = project.status === "On hold" ? Math.max(1, base - 1) : base;
      const scope = project.currentRisk === "Medium" ? Math.max(1, base - 1) : Math.min(5, base + 1);
      const budget = project.currentRisk === "Low" ? Math.min(5, base + 1) : base;

      return { time, scope, budget };
    }

    function buildDefaultHealthRadar(score) {
      const base = Math.max(1, Math.min(5, Math.round(score / 20)));
      return {
        governance: base,
        sponsorEngagement: Math.min(5, base + 1),
        scope: base,
        budget: base,
        schedule: Math.max(1, base - 1),
        resourcing: Math.max(1, base - 1),
        riskIssues: base,
        quality: Math.min(5, base + 1)
      };
    }

    function getStoredDraftState() {
      try {
        const stored = window.localStorage.getItem(draftStorageKey);
        if (!stored) {
          return { editingDraftId: null, formValues: defaultForm };
        }

        const parsed = JSON.parse(stored);
        if (parsed && parsed.formValues) {
          return {
            editingDraftId: parsed.editingDraftId || null,
            formValues: normaliseFormValues(parsed.formValues)
          };
        }

        return {
          editingDraftId: null,
          formValues: normaliseFormValues(parsed)
        };
      } catch {
        return { editingDraftId: null, formValues: defaultForm };
      }
    }

    function isSubmittedWorkflowProject(project) {
      const workflowText = [
        project.whatHappenedLastMonth,
        project.currentPosition,
        project.next30DaysPipeline,
        project.steeringDecisionNeeded
      ].join(" ").toLowerCase();

      const hasDraftSignals = /draft saved|not yet submitted|awaiting submission/.test(workflowText);
      const hasSubmittedSignals = /submitted|decision board|pmo|waiting for review|waiting for pmo|leadership review/.test(workflowText);

      return !hasDraftSignals && (
        project.status === "Submitted"
        || project.roadmapPhase === "submitted"
        || !!project.submittedDocuments?.length
        || hasSubmittedSignals
      );
    }

    function buildFallbackSubmittedDocuments(project) {
      if (project.submittedDocuments?.length) return project.submittedDocuments;
      if (!project.draftFormValues || !isComplete(project.draftFormValues)) return project.submittedDocuments;

      const assessedProject = assess(buildAssessmentInput(project.draftFormValues));
      const fallbackDocuments = buildSubmittedDocumentsFromValues(project.draftFormValues, {}, assessedProject, project.name);
      if (!fallbackDocuments.length) return project.submittedDocuments;

      return fallbackDocuments.map((document) => ({
        ...document,
        uploadedAt: "Submitted earlier"
      }));
    }

    function getLifecycleFileExtension(fileName) {
      const match = fileName.match(/\.[^.]+$/);
      return match ? match[0] : ".docx";
    }

    function buildMockSharePointHref(fileName, projectName, sectionLabel) {
      const content = [
        "Mock SharePoint document library item",
        `File: ${fileName}`,
        `Project: ${projectName}`,
        `Section: ${sectionLabel}`,
        "",
        "This is a placeholder prototype document used to demonstrate the lifecycle governance flow."

      return `data:text/plain;charset=utf-8,${encodeURIComponent(content)}`;

    function getLifecyclePhaseLabel(phaseKey) {
      return lifecyclePhaseDefinitions.find((phase) => phase.key === phaseKey)?.label || "Lifecycle phase";
    }

    function getLifecyclePhaseIndex(phaseKey) {
      return Math.max(0, lifecyclePhaseDefinitions.findIndex((phase) => phase.key === phaseKey));
    }

    function getRoadmapPhaseForLifecyclePhase(phaseKey) {
      if (phaseKey === "initiation") return "submitted";
      if (phaseKey === "planning") return "definition";
      if (phaseKey === "delivery") return "delivery";
      if (phaseKey === "closure") return "closure";
      return "submitted";

    function canAccessLifecycleProject(project) {

      if (project.lifecycleCurrentPhase) return project.lifecycleCurrentPhase;
      if (project.lifecycleGovernance?.currentPhase) return project.lifecycleGovernance.currentPhase;
      const overridePhase = lifecycleCurrentPhaseOverrides[normaliseProjectName(project.name)];
      if (overridePhase) return overridePhase;
      if (project.status === "Completed" || project.roadmapPhase === "closure") return "closure";
      if (project.status === "Planning" || project.roadmapPhase === "definition") return "planning";
      if (project.status === "Active" && project.roadmapPhase === "delivery") return "delivery";
      if (project.roadmapPhase === "delivery") return "delivery";
      return "initiation";
    }

    function getLifecyclePhaseRelation(phaseKey, currentPhaseKey) {
      const phaseIndex = getLifecyclePhaseIndex(phaseKey);
      const currentPhaseIndex = getLifecyclePhaseIndex(currentPhaseKey);

      if (phaseIndex < currentPhaseIndex) return "historic";
      if (phaseIndex === currentPhaseIndex) return "current";
      if (phaseIndex === currentPhaseIndex + 1) return "next";
      return "future";
    }

    function isLifecycleDocumentUploaded(project, phaseKey, relation, docIndex) {
      const uploadedOverride = lifecycleUploadedPhaseOverrides[normaliseProjectName(project.name)] || [];
      if (uploadedOverride.includes(phaseKey)) return true;
      if (relation === "historic") return true;
      if (relation === "current") return docIndex === 0 && project.status !== "Submitted";
      return false;

          const relation = getLifecyclePhaseRelation(phase.key, currentPhase);
          const savedPhase = savedRecord.phases?.find((item) => item.key === phase.key) || {};
          return {
            key: phase.key,
            label: phase.label,
            gatewayLabel: phase.gatewayLabel,
            readinessChecklist: phase.readinessChecklist,
            nextSteps: phase.nextSteps,
            documents: phase.documents.map((document, index) => {
              const savedDocument = savedPhase.documents?.find((item) => item.id === document.id) || {};
              const uploaded = isLifecycleDocumentUploaded(project, phase.key, relation, index);
              const uploadedFileName = `${project.name} - ${document.title}${getLifecycleFileExtension(document.templateLabel)}`;
              return {
                ...document,
                uploaded: typeof savedDocument.uploaded === "boolean" ? savedDocument.uploaded : uploaded,
                uploadedAt: savedDocument.uploadedAt || (uploaded ? (relation === "historic" ? "Passed gateway" : "Uploaded for review") : ""),

                readOnly: relation === "historic"

    function RadarChart({ data }) {
      const axes = [
        ["Governance", data.governance],
        ["Sponsor Engagement", data.sponsorEngagement],
        ["Scope", data.scope],
        ["Budget", data.budget],
        ["Schedule", data.schedule],
        ["Resourcing", data.resourcing],
        ["Risk & Issues", data.riskIssues],
        ["Quality", data.quality]
      ];
      const size = 320;
      const center = size / 2;
      const maxRadius = 108;
      const levels = [1, 2, 3, 4, 5];

      const pointFor = (value, index, radiusMultiplier = 1) => {
        const angle = ((Math.PI * 2) / axes.length) * index - Math.PI / 2;
        const radius = (value / 5) * maxRadius * radiusMultiplier;
        return [center + Math.cos(angle) * radius, center + Math.sin(angle) * radius];
      };

      const polygonPoints = axes.map(([, value], index) => pointFor(value, index).join(",")).join(" ");

      return (
        <div className="radar-chart-wrap">
          <svg viewBox={`0 0 ${size} ${size}`} className="radar-chart" role="img" aria-label="Project health radar chart">
            {levels.map((level) => {
              const points = axes.map((_, index) => pointFor(level, index, 1).join(",")).join(" ");
              return <polygon key={level} points={points} className="radar-grid" />;
            })}
            {axes.map(([label], index) => {
              const [x, y] = pointFor(5, index, 1.1);
              return (
                <g key={label}>
                  <line x1={center} y1={center} x2={pointFor(5, index)[0]} y2={pointFor(5, index)[1]} className="radar-axis" />
                  <text x={x} y={y} className="radar-label" textAnchor={x < center - 8 ? "end" : x > center + 8 ? "start" : "middle"}>{label}</text>
                </g>
              );
            })}
            <polygon points={polygonPoints} className="radar-shape" />
            {axes.map(([label, value], index) => {
              const [x, y] = pointFor(value, index);
              return <circle key={`${label}-${value}`} cx={x} cy={y} r="4" className={`radar-point radar-point-${value}`} />;
            })}
          </svg>
          <p className="radar-scale-note">The closer the shape is to the outside, the healthier that area is right now.</p>
          <div className="radar-scale" aria-label="Project health legend">
            <span className="radar-legend-item"><span className="radar-legend-dot radar-legend-dot-watch" aria-hidden="true"></span>Needs support</span>
            <span className="radar-legend-item"><span className="radar-legend-dot radar-legend-dot-track" aria-hidden="true"></span>Needs watching</span>
            <span className="radar-legend-item"><span className="radar-legend-dot radar-legend-dot-strong" aria-hidden="true"></span>In a healthy place</span>
          </div>
        </div>
      );
    }

        draftFormValues: options.draftFormValues ?? null,

        lifecycleCurrentPhase,

        startDate: normalised.startDate,

    function LifecycleGovernanceModal({ project, onClose, onSaveLifecycleProject, canReviewPmo }) {
      const [lifecycleRecord, setLifecycleRecord] = useState(null);
      const [activePhase, setActivePhase] = useState("initiation");
      const [lifecycleNotice, setLifecycleNotice] = useState("");

      useEffect(() => {
        if (!project) {
          setLifecycleRecord(null);
          setActivePhase("initiation");
          setLifecycleNotice("");
          return;
        }

        const record = buildLifecycleGovernanceRecord(project);
        setLifecycleRecord(record);
        setActivePhase(record.currentPhase);
        setLifecycleNotice("");
      }, [project]);

      if (!project || !lifecycleRecord) {
        return <Modal isOpen={false} onClose={onClose} titleId="lifecycleGovernanceTitle" />;
      }

      const projectObjective = project.businessObjective || project.draftFormValues?.projectDescription || "No project description has been added yet.";
      const activePhaseRecord = lifecycleRecord.phases.find((phase) => phase.key === activePhase) || lifecycleRecord.phases[0];
      const activeRelation = getLifecyclePhaseRelation(activePhaseRecord.key, lifecycleRecord.currentPhase);
      const currentPhaseIndex = getLifecyclePhaseIndex(lifecycleRecord.currentPhase);
      const followingPhaseRecord = lifecycleRecord.phases[getLifecyclePhaseIndex(activePhaseRecord.key) + 1] || null;
      const requiredDocuments = activePhaseRecord.documents.filter((document) => document.required !== false);
      const optionalDocuments = activePhaseRecord.documents.filter((document) => document.required === false);
      const activeUploadedCount = requiredDocuments.filter((document) => document.uploaded).length;
      const requiredDocumentsReady = requiredDocuments.every((document) => document.uploaded);
      const canSubmitForGateway = activeRelation === "current" && requiredDocumentsReady;
      const reviewStatusClass = activePhaseRecord.reviewStatus === lifecycleReviewStatuses.approved
        ? "approved"
        : activePhaseRecord.reviewStatus === lifecycleReviewStatuses.onHold
          ? "on-hold"
          : activePhaseRecord.reviewStatus === lifecycleReviewStatuses.rejected
            ? "rejected"
            : activePhaseRecord.reviewStatus === lifecycleReviewStatuses.submitted
              ? "submitted"
              : "draft";

      const getReadinessState = () => {
        if (activeRelation === "historic") {
          return {
            label: "Gateway done",
            tone: "done",
            copy: "This gateway has already been finished."
          };
        }

        if (activeRelation === "current") {
          return requiredDocumentsReady
            ? {
                label: "Ready for PMO review",
                tone: "ready",
                copy: "All required files are ready."
              }
            : {
                label: `${activeUploadedCount} of ${requiredDocuments.length} required files ready`,
                tone: "working",
                copy: "Upload the missing required files."
              };
        }

        if (activeRelation === "next") {
          return {
            label: "Next stage",
            tone: "next",
            copy: "You can get ready early for this stage."
          };
        }

        return {
          label: "Later stage",
          tone: "future",
          copy: "Nothing needs to happen here yet."
        };
      };

      const buildAuditEntry = (action, detail) => ({
        id: `${Date.now()}-${Math.random().toString(16).slice(2)}`,
        action,
        detail,
        createdAt: new Date().toLocaleString("en-GB", { dateStyle: "short", timeStyle: "short" })
      });

      const persistLifecycleRecord = (nextRecord, projectUpdates = {}) => {
        setLifecycleRecord(nextRecord);
        onSaveLifecycleProject(project.id, {
          lifecycleGovernance: nextRecord,
          lifecycleCurrentPhase: nextRecord.currentPhase,
          ...projectUpdates
        });
      };

      const updateLifecyclePhase = (phaseKey, updater, projectUpdates = {}) => {
        setLifecycleRecord((current) => {
          if (!current) return current;
          const nextRecord = {
            ...current,
            phases: current.phases.map((phase) => (phase.key === phaseKey ? updater(phase) : phase))
          };
          onSaveLifecycleProject(project.id, {
            lifecycleGovernance: nextRecord,
            lifecycleCurrentPhase: nextRecord.currentPhase,
            ...projectUpdates
          });
          return nextRecord;
        });
      };

      const mockUploadDocument = (phaseKey, documentId) => {
        updateLifecyclePhase(phaseKey, (phase) => ({
          ...phase,
          documents: phase.documents.map((document) => (
            document.id !== documentId
              ? document
              : {
                  ...document,
                  uploaded: true,
                  uploadedAt: "Uploaded",
                  uploadedHref: buildMockSharePointHref(document.uploadedFileName, project.name, `${phase.label} uploaded file`)
                }
          )),
          auditTrail: [
            buildAuditEntry("Document uploaded", `${phase.label}: ${phase.documents.find((document) => document.id === documentId)?.title || "Document"}`),
            ...(phase.auditTrail || [])
          ]
        }));
        setLifecycleNotice("Document uploaded.");
      };

      const addAdditionalDocument = (phaseKey) => {
        updateLifecyclePhase(phaseKey, (phase) => {
          const nextNumber = (phase.additionalDocuments?.length || 0) + 1;
          const title = `Supporting document ${nextNumber}`;
          const uploadedFileName = `${project.name} - ${phase.label} - ${title}.docx`;

          return {
            ...phase,
            additionalDocuments: [
              ...(phase.additionalDocuments || []),
              {
                id: `additional-${Date.now()}`,
                title,
                summary: "Extra supporting file",
                uploadedAt: "Uploaded",
                uploadedFileName,
                uploadedHref: buildMockSharePointHref(uploadedFileName, project.name, `${phase.label} supporting document`)
              }
            ],
            auditTrail: [
              buildAuditEntry("Supporting document added", `${phase.label}: ${title}`),
              ...(phase.auditTrail || [])
            ]
          };
        });
        setLifecycleNotice("Supporting document uploaded.");
      };

      const submitForGatewayReview = () => {
        if (!canSubmitForGateway) return;
        const notification = notifyPmoMailbox({
          ...project,
          projectNumber: project.projectNumber,
          createdBy: project.createdBy || project.projectManager || currentUserProfile.name
        });

        updateLifecyclePhase(activePhaseRecord.key, (phase) => ({
          ...phase,
          reviewStatus: lifecycleReviewStatuses.submitted,
          auditTrail: [
            buildAuditEntry("Submitted for PMO review", `${notification.submittedBy} submitted ${phase.label} on ${notification.submittedAt}.`),
            ...(phase.auditTrail || [])
          ]
        }), {
          status: "Submitted for PMO review",
          lifecycleReviewStatus: lifecycleReviewStatuses.submitted,
          pmoNotifications: [notification, ...(project.pmoNotifications || [])],
          currentPosition: `Submitted for PMO review on ${notification.submittedAt}.`
        });

        setLifecycleNotice(`Sent to PMO: ${notification.projectName} (${notification.projectNumber}).`);
      };

      const handlePmoOutcome = (outcome) => {
        const nextPhase = lifecyclePhaseDefinitions[getLifecyclePhaseIndex(activePhaseRecord.key) + 1] || null;
        const isClosureApproval = activePhaseRecord.key === "closure";
        const nextLifecyclePhase = outcome === lifecycleReviewStatuses.approved
          ? (isClosureApproval ? activePhaseRecord.key : (nextPhase?.key || activePhaseRecord.key))
          : lifecycleRecord.currentPhase;
        const nextStatus = outcome === lifecycleReviewStatuses.approved
          ? (isClosureApproval ? "Completed" : nextPhase?.label || project.status)
          : outcome === lifecycleReviewStatuses.onHold
            ? "On hold"
            : "Rejected";
        const nextPosition = outcome === lifecycleReviewStatuses.approved
          ? isClosureApproval
            ? "PMO approved closure. The project is complete."
            : `PMO approved this stage. The project can move into ${nextPhase?.label || activePhaseRecord.label}.`
          : outcome === lifecycleReviewStatuses.onHold
            ? "PMO has put this project on hold for now."
            : "PMO rejected this review. More work is needed before it can be sent again.";

        const nextRecord = {
          ...lifecycleRecord,
          currentPhase: nextLifecyclePhase,
          phases: lifecycleRecord.phases.map((phase) => (
            phase.key !== activePhaseRecord.key
              ? phase
              : {
                  ...phase,
                  reviewStatus: outcome,
                  auditTrail: [
                    buildAuditEntry("PMO review update", `${activePhaseRecord.label}: ${outcome}`),
                    ...(phase.auditTrail || [])
                  ]
                }
          ))
        };

        persistLifecycleRecord(nextRecord, {
          status: nextStatus,
          roadmapPhase: getRoadmapPhaseForLifecyclePhase(nextLifecyclePhase),
          lifecycleReviewStatus: outcome,
          lifecycleCurrentPhase: nextLifecyclePhase,
          currentPosition: nextPosition
        });
        setActivePhase(nextLifecyclePhase);
        setLifecycleNotice(`PMO marked this stage as ${outcome}.`);
      };

      const activeReadiness = getReadinessState();

      return (
        <Modal isOpen={!!project} onClose={onClose} titleId="lifecycleGovernanceTitle" panelClassName="modal-panel-fullscreen">
          <div className="detail-modal lifecycle-modal">
            <div className="detail-header">
              <div>
                <p className="eyebrow">Lifecycle governance</p>
                <h2 id="lifecycleGovernanceTitle" className="detail-title">{project.name} lifecycle</h2>
                <p className="section-copy lifecycle-objective"><strong>Project description:</strong> {projectObjective}</p>
              </div>
              <button className="icon-btn" type="button" aria-label="Close lifecycle governance" onClick={onClose}><Icon icon="close" className="icon-only-svg" /></button>
            </div>

            <section className="detail-card lifecycle-stage-summary-card">
              <div className="section-header-row">
                <div className="section-title-row">
                  <p className="section-title">Stage now</p>
                </div>
              </div>
              <div className="lifecycle-stage-summary">
                <strong>{getLifecyclePhaseLabel(lifecycleRecord.currentPhase)}</strong>
                <span>{lifecyclePhaseDefinitions.find((phase) => phase.key === lifecycleRecord.currentPhase)?.gatewayLabel || "Current gateway"}</span>
              </div>
            </section>

            <section className="detail-card lifecycle-journey-card">
              <div className="section-header-row">
                <div className="section-title-row">
                  <p className="section-title">Lifecycle flow</p>
                </div>
              </div>

              <div className="lifecycle-journey">
                {lifecyclePhaseDefinitions.map((phase, index) => {
                  const relation = getLifecyclePhaseRelation(phase.key, lifecycleRecord.currentPhase);
                  const isCurrent = phase.key === lifecycleRecord.currentPhase;
                  const isActiveTab = phase.key === activePhase;

                  return (
                    <React.Fragment key={`journey-${phase.key}`}>
                      <button
                        className={`lifecycle-stage lifecycle-stage-${relation} ${isActiveTab ? "lifecycle-stage-active" : ""}`}
                        type="button"
                        onClick={() => setActivePhase(phase.key)}
                      >
                        <span className="lifecycle-stage-number">{index + 1}</span>
                        <strong>{phase.label}</strong>
                        <span>{isCurrent ? "Now" : relation === "historic" ? "Done" : relation === "next" ? "Next" : "Later"}</span>
                      </button>
                      {index < lifecyclePhaseDefinitions.length - 1 && (
                        <div className={`lifecycle-gateway lifecycle-gateway-${index < currentPhaseIndex ? "passed" : index === currentPhaseIndex ? "current" : "upcoming"}`}>
                          <span className="lifecycle-gateway-diamond" aria-hidden="true"></span>
                          <small>{phase.gatewayLabel}</small>
                        </div>
                      )}
                    </React.Fragment>
                  );
                })}
              </div>
            </section>

            <section className="detail-card">
              <div className="lifecycle-phase-main">
                <div className="lifecycle-simple-grid">
                  <section className="lifecycle-side-card">
                    <p className="section-title">Gateway readiness</p>
                    <p className="section-copy">{activeReadiness.copy}</p>
                    <ul className="lifecycle-checklist">
                      <li>Gateway: {activePhaseRecord.gatewayLabel}</li>
                      <li>Required files ready: {activeUploadedCount} of {requiredDocuments.length}</li>
                      {activePhaseRecord.readinessChecklist.map((item, index) => <li key={`${activePhaseRecord.key}-ready-${index}`}>{item}</li>)}
                    </ul>
                  </section>

                  <section className="lifecycle-side-card">
                    <p className="section-title">What comes next</p>
                    <p className="section-copy">
                      {followingPhaseRecord
                        ? `${followingPhaseRecord.label} comes after this stage.`
                        : "This is the last stage."}
                    </p>
                    <ul className="lifecycle-checklist">
                      {activePhaseRecord.nextSteps.map((item, index) => <li key={`${activePhaseRecord.key}-next-${index}`}>{item}</li>)}
                    </ul>
                    {followingPhaseRecord && (
                      <button className="secondary-btn lifecycle-next-btn" type="button" onClick={() => setActivePhase(followingPhaseRecord.key)}>
                        Open {followingPhaseRecord.label}
                      </button>
                    )}
                  </section>
                </div>

                <section className="lifecycle-document-panel">
                  <div className="section-header-row">
                    <div>
                      <p className="section-title">Required / Optional Documents</p>
                      <p className="section-copy lifecycle-document-hint">Required files have a red asterisk.</p>
                    </div>
                    <div className="section-actions">
                      <button className="primary-btn lifecycle-submit-btn" type="button" disabled={!canSubmitForGateway} onClick={submitForGatewayReview}>
                        Submit for PMO review
                      </button>
                    </div>
                  </div>

                  <div className="lifecycle-submit-note">
                    {requiredDocumentsReady ? "All required files are ready." : "Upload every required file before you submit."}
                  </div>
                  {lifecycleNotice && <p className="lifecycle-inline-note">{lifecycleNotice}</p>}

                  <div className="lifecycle-document-grid">
                    {[...requiredDocuments, ...optionalDocuments].map((document) => {
                      const canMockUpload = !document.uploaded && (activeRelation === "current" || activeRelation === "next");

                      return (
                        <article className="lifecycle-document-card" key={`${activePhaseRecord.key}-${document.id}`}>
                          <div className="lifecycle-document-card-header">
                            <div>
                              <p className="lifecycle-document-title">
                                {document.title}
                                {document.required !== false && <span className="lifecycle-required-star" aria-label="Required">*</span>}
                              </p>
                            </div>
                            <span className={`lifecycle-upload-badge lifecycle-upload-badge-${document.uploaded ? "uploaded" : "missing"}`}>
                              {document.uploaded ? "Uploaded" : "Missing"}
                            </span>
                          </div>

                          <div className="lifecycle-document-links">
                            <div className="lifecycle-document-link-row">
                              <a className="doc-link" href={document.templateHref} download={document.templateLabel}>Download {document.title}</a>
                              {document.uploaded ? (
                                <a className="doc-link" href={document.uploadedHref} download={document.uploadedFileName}>View uploaded file</a>
                              ) : (
                                <span className="lifecycle-doc-helper">No file uploaded</span>
                              )}
                            </div>
                          </div>

                          <div className="lifecycle-document-actions">
                            {document.readOnly ? (
                              <span className="lifecycle-doc-helper">Locked after sign-off</span>
                            ) : canMockUpload ? (
                              <button className="secondary-btn lifecycle-upload-btn" type="button" onClick={() => mockUploadDocument(activePhaseRecord.key, document.id)}>Upload file</button>
                            ) : (
                              <span className="lifecycle-doc-helper">Template ready to use</span>
                            )}
                          </div>
                        </article>
                      );
                    })}
                  </div>

                  <div className="lifecycle-additional-documents">
                    <div className="section-header-row">
                      <div>
                        <p className="section-title">Supporting documents</p>
                        <p className="section-copy">Extra files for this stage.</p>
                      </div>
                      <button className="secondary-btn" type="button" onClick={() => addAdditionalDocument(activePhaseRecord.key)}>Upload supporting document</button>
                    </div>
                    {(activePhaseRecord.additionalDocuments || []).length ? (
                      <div className="lifecycle-extra-doc-list">
                        {activePhaseRecord.additionalDocuments.map((document) => (
                          <a className="doc-link" href={document.uploadedHref} download={document.uploadedFileName} key={document.id}>{document.title}</a>
                        ))}
                      </div>
                    ) : (
                      <p className="lifecycle-doc-helper">No supporting files yet.</p>
                    )}
                  </div>
                </section>

                {canReviewPmo && (
                  <section className="lifecycle-review-panel">
                    <div className="section-header-row">
                      <div>
                        <p className="section-title">PMO review</p>
                        <p className="section-copy">Only PMO admins can use these controls.</p>
                      </div>
                      <span className={`lifecycle-review-status lifecycle-review-status-${reviewStatusClass}`}>{activePhaseRecord.reviewStatus}</span>
                    </div>
                    <div className="lifecycle-review-actions">
                      <button className="secondary-btn" type="button" onClick={() => handlePmoOutcome(lifecycleReviewStatuses.approved)}>Approved</button>
                      <button className="secondary-btn" type="button" onClick={() => handlePmoOutcome(lifecycleReviewStatuses.onHold)}>On Hold</button>
                      <button className="secondary-btn" type="button" onClick={() => handlePmoOutcome(lifecycleReviewStatuses.rejected)}>Rejected</button>
                    </div>
                  </section>
                )}
              </div>
            </section>
          </div>
        </Modal>
      );
    }
